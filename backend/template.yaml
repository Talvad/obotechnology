AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Obotechnology Backend - Backend Http Api for Obotechnology

Parameters:
  AllowedOrigin:
    Type: String
    Default: "*"
    Description: Origin allowed by CORS (set to your frontend URL in production)

Globals:
  Function:
    Runtime: nodejs24.x
    Architectures:
      - x86_64
    Timeout: 10

Resources:
  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      DefaultRouteSettings:
        ThrottlingBurstLimit: 50
        ThrottlingRateLimit: 100
      CorsConfiguration:
        AllowOrigins: [!Ref AllowedOrigin]
        AllowMethods:
          - GET
          - POST
          - PUT
          - DELETE
          - OPTIONS
        AllowHeaders:
          - Authorization
          - Content-Type
        MaxAge: 600

  HelloFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src
      Handler: hello.handler
      Description: Hello function, can be used for health check
      Events:
        HelloApi:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: GET
            Path: /api/v1/hello
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2022
        Sourcemap: false
        External: ["@aws-sdk/*"]
        EntryPoints: ["handlers/hello.ts"]

  UserFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src
      Handler: user.handler
      Description: Signup,
      Events:
        Signup:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: POST
            Path: /api/v1/auth/signup
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2022
        Sourcemap: false
        External: ["@aws-sdk/*"]
        EntryPoints: ["handlers/user.ts"]

Outputs:
  ApiUrl:
    Description: HTTP API base URL
    Value: !Sub https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com/api/v1
